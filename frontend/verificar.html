<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Confirmando tu correo · YES EMS</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/cuenta.css?v=202607221536">

<main class="cuenta-wrap">
  <div class="cuenta-card">
    <div class="cuenta-logo">YES<span>EMS</span></div>

    <div id="estado" class="cuenta-estado">
      <div class="spinner" aria-hidden="true"></div>
      <h1>Confirmando tu correo…</h1>
      <p>Solo tardará un momento.</p>
    </div>
  </div>
</main>

<script src="js/config/api.js?v=202607221536"></script>
<script>
(function () {
  const API = (window.YESEMS_API_URL || '').replace(/\/$/, '');
  const caja = document.getElementById('estado');
  const token = new URLSearchParams(location.search).get('token');

  function pintar(icono, clase, titulo, texto, boton) {
    caja.className = 'cuenta-estado ' + clase;
    caja.innerHTML =
      '<div class="cuenta-icono">' + icono + '</div>' +
      '<h1>' + titulo + '</h1>' +
      '<p>' + texto + '</p>' +
      (boton || '');
  }

  if (!token) {
    pintar('!', 'err', 'Enlace incompleto',
      'Abre el enlace tal como viene en el correo, sin recortarlo.',
      '<a class="cuenta-btn" href="index.html">Ir al inicio</a>');
    return;
  }

  if (!API) {
    pintar('!', 'err', 'Falta configurar la API',
      'Avisa al administrador del sitio.', '');
    return;
  }

  fetch(API + '/api/auth/verificar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token }),
  })
    .then(async (r) => {
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || 'No se pudo confirmar tu correo.');
      // El servidor devuelve la sesión ya iniciada: el usuario entra directo.
      // Se guarda también el perfil: así el panel y el curso abren al
      // instante, sin depender de que el servidor esté despierto.
      try {
        localStorage.setItem('yesems_token', d.token);
        if (d.user) localStorage.setItem('yesems_user', JSON.stringify(d.user));
      } catch (e) {}
      pintar('✓', 'ok', '¡Listo, tu cuenta está activa!',
        'Ya puedes acceder a todo tu material de estudio.',
        '<a class="cuenta-btn" href="acredita-bach.html">Entrar al curso</a>');
    })
    .catch((e) => {
      pintar('!', 'err', 'No pudimos confirmar tu correo',
        e.message,
        '<a class="cuenta-btn" href="index.html">Ir al inicio</a>');
    });
})();
</script>
