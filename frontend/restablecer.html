<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Nueva contraseña · YES EMS</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/cuenta.css?v=202607241323">

<main class="cuenta-wrap">
  <div class="cuenta-card">
    <div class="cuenta-logo">YES<span>EMS</span></div>

    <div id="estado" class="cuenta-estado">
      <h1>Crea tu nueva contraseña</h1>
      <p>Escríbela dos veces para confirmar que coinciden.</p>

      <form id="form" class="cuenta-form" autocomplete="off">
        <label for="p1">Nueva contraseña</label>
        <input type="password" id="p1" autocomplete="new-password"
               placeholder="Mínimo 8 caracteres" minlength="8" required>

        <label for="p2">Repite la contraseña</label>
        <input type="password" id="p2" autocomplete="new-password"
               placeholder="La misma de arriba" minlength="8" required>

        <p class="cuenta-error" id="error" hidden></p>
        <button type="submit" class="cuenta-btn" id="enviar">Guardar contraseña</button>
      </form>
    </div>
  </div>
</main>

<script src="js/config/api.js?v=202607241323"></script>
<script>
(function () {
  const API = (window.YESEMS_API_URL || '').replace(/\/$/, '');
  const caja = document.getElementById('estado');
  const token = new URLSearchParams(location.search).get('token');

  function pintar(icono, clase, titulo, texto, boton) {
    caja.className = 'cuenta-estado ' + clase;
    caja.innerHTML =
      '<div class="cuenta-icono">' + icono + '</div>' +
      '<h1>' + titulo + '</h1>' +
      '<p>' + texto + '</p>' +
      (boton || '');
  }

  if (!token) {
    pintar('!', 'err', 'Enlace incompleto',
      'Abre el enlace tal como viene en el correo, sin recortarlo.',
      '<a class="cuenta-btn" href="index.html">Ir al inicio</a>');
    return;
  }

  const form = document.getElementById('form');
  const err = document.getElementById('error');
  const btn = document.getElementById('enviar');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.hidden = true;

    const p1 = document.getElementById('p1').value;
    const p2 = document.getElementById('p2').value;

    if (p1 !== p2) { err.textContent = 'Las contraseñas no coinciden.'; err.hidden = false; return; }
    if (p1.length < 8) { err.textContent = 'Debe tener al menos 8 caracteres.'; err.hidden = false; return; }

    btn.disabled = true;
    btn.textContent = 'Guardando…';
    try {
      const r = await fetch(API + '/api/auth/restablecer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: p1 }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || 'No se pudo cambiar la contraseña.');

      // El servidor devuelve la sesión iniciada: no hay que volver a entrar.
      try {
        localStorage.setItem('yesems_token', d.token);
        if (d.user) localStorage.setItem('yesems_user', JSON.stringify(d.user));
      } catch (e2) {}
      pintar('✓', 'ok', 'Contraseña actualizada',
        'Ya iniciamos tu sesión con la contraseña nueva.',
        '<a class="cuenta-btn" href="acredita-bach.html">Entrar al curso</a>');
    } catch (e3) {
      err.textContent = e3.message;
      err.hidden = false;
      btn.disabled = false;
      btn.textContent = 'Guardar contraseña';
    }
  });
})();
</script>
