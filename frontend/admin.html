<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YES EMS · Panel de Administrador</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/admin.css?v=202607241315">
</head>
<body class="admin-body">

<!-- ===== Barra superior ===== -->
<header class="admin-bar" id="adminBar">
  <div class="admin-bar-left">
    <a class="admin-logo" href="index.html" title="Ir al sitio">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="adlogo" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#0a1e3f"></stop><stop offset="49.9%" stop-color="#0a1e3f"></stop>
          <stop offset="50%" stop-color="#5cb85c"></stop><stop offset="100%" stop-color="#5cb85c"></stop>
        </linearGradient></defs>
        <path d="M8 6 L28 6 L32 22 L36 6 L56 6 L40 36 L40 58 L24 58 L24 36 Z" fill="url(#adlogo)"></path>
      </svg>
    </a>
    <div class="admin-bar-titles">
      <strong>Panel de administrador</strong>
      <span>Acredita-Bach · CENEVAL</span>
    </div>
    <span class="admin-source" id="adminSource"></span>
  </div>
  <div class="admin-bar-right">
    <span class="admin-dirty" id="adminDirty" hidden="">● Cambios sin guardar</span>
    <a class="admin-btn ghost" href="acredita-bach.html" target="_blank" rel="noopener">Vista previa ↗</a>
    <button class="admin-btn primary" id="btnSave" type="button">Guardar cambios</button>
    <div class="admin-acct">
      <span class="admin-avatar" id="adminAvatar">A</span>
      <div class="admin-acct-info">
        <span id="adminEmail">—</span>
        <button class="admin-link" id="btnLogout" type="button">Cerrar sesión</button>
      </div>
    </div>
  </div>
</header>

<!-- ===== Pantalla de acceso / barrera ===== -->
<!-- Nace VISIBLE: cubre el panel desde el primer instante, para que no se
     alcance a ver ni tocar nada sin ser administrador. admin.js la oculta
     solo cuando confirma una sesion de administrador. -->
<div class="admin-gate" id="adminGate">
  <div class="gate-card" id="gateCard">
    <div class="gate-logo">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="gatelogo" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#0a1e3f"></stop><stop offset="49.9%" stop-color="#0a1e3f"></stop>
          <stop offset="50%" stop-color="#5cb85c"></stop><stop offset="100%" stop-color="#5cb85c"></stop>
        </linearGradient></defs>
        <path d="M8 6 L28 6 L32 22 L36 6 L56 6 L40 36 L40 58 L24 58 L24 36 Z" fill="url(#gatelogo)"></path>
      </svg>
    </div>
    <div id="gateBody">
      <h1>Cargando…</h1>
      <p>Un momento, por favor.</p>
    </div>
  </div>
</div>

<script>
// Vigilante. Este script va incrustado en el HTML, así que se ejecuta aunque
// los archivos .js externos no lleguen a cargar. Si a los 8 segundos el panel
// no ha tomado el control, lo dice en pantalla en vez de dejar un "Cargando…"
// eterno que no explica nada.
(function () {
  var t0 = Date.now();
  setTimeout(function () {
    var cuerpo = document.getElementById('gateBody');
    if (!cuerpo || cuerpo.dataset.listo === '1') return;

    var faltan = [];
    if (typeof window.YESEMS_API_URL === 'undefined') faltan.push('config/api.js');
    if (typeof window.YESEMS_AUTH    === 'undefined') faltan.push('auth.js');
    if (typeof window.YESEMS_CONTENT === 'undefined') faltan.push('content.js');
    if (typeof window.modulesData    === 'undefined') faltan.push('data/modules.js');
    if (!window.__ADMIN_JS_OK)                        faltan.push('pages/admin.js');

    cuerpo.innerHTML =
      '<h1>No se pudo cargar el panel</h1>' +
      '<p>Algunos archivos del sitio no llegaron a tu navegador. Suele ser una ' +
      'extensión, un antivirus o un bloqueador de anuncios interceptando la descarga.</p>' +
      '<p style="margin-top:12px;font-size:12.5px;color:#64748b;line-height:1.7">' +
      'Sin cargar: <strong>' + (faltan.length ? faltan.join(', ') : 'ninguno detectado') + '</strong><br>' +
      'Tiempo transcurrido: ' + Math.round((Date.now() - t0) / 1000) + ' s</p>' +
      '<div class="gate-actions" style="margin-top:16px">' +
      '<button class="gate-btn" onclick="location.reload()">Reintentar</button>' +
      '<a class="gate-btn alt" href="index.html">Volver al sitio</a></div>';
  }, 8000);
})();
</script>

<!-- ===== Cuerpo del panel ===== -->
<div id="adminAviso" hidden style="padding:12px 18px;background:#fff4e5;border-bottom:1px solid #f0d9b8;color:#7a4b00;font-size:14px;line-height:1.6;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
  <span id="adminAvisoTexto"></span>
  <button id="adminAvisoBtn" type="button" style="padding:7px 14px;border:0;border-radius:8px;background:#0a1e3f;color:#fff;font:inherit;font-size:13px;font-weight:600;cursor:pointer">Iniciar sesión</button>
</div>
<div class="admin-shell" id="adminShell">
  <aside class="admin-side">
    <nav class="side-tabs" id="sideTabs">
      <button class="side-tab active" data-tab="content" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4h16v4l-6 4 6 4v4H4v-4l6-4-6-4z"></path></svg>
        Áreas y temas
      </button>
      <button class="side-tab" data-tab="subscription" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M2 10h20"></path></svg>
        Suscripción
      </button>
      <button class="side-tab" data-tab="status" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg>
        Estado y ayuda
      </button>
    </nav>

    <div class="side-areas" id="sideAreas" data-tabgroup="content">
      <div class="side-areas-head">
        <span>Áreas del examen</span>
        <button class="side-add" id="btnAddArea" type="button" title="Agregar área">+</button>
      </div>
      <div class="side-area-list" id="sideAreaList"></div>
    </div>
  </aside>

  <main class="admin-main" id="adminMain"></main>
</div>

<!-- aviso flotante -->
<div class="admin-toast" id="adminToast" hidden=""></div>
