  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

9, U+20F0, U+25CC, U+A830-A839, U+A8E0-A8FF, U+11B00-11B09;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"d0876377-d57e-4f18-8b5f-56d7d9af4ca2\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"dad4f611-4b2f-4d6c-8e2f-8deba1842579\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ================================================\n   YES EMS — Sistema de diseño\n   Light theme, azul marino + verde\n   ================================================ */\n\n:root {\n  /* brand */\n  --navy-900:  #061328;\n  --navy-800:  #0a1e3f;\n  --navy-700:  #0e2548;\n  --navy-600:  #142e58;\n  --green-600: #4caf50;\n  --green-500: #5cb85c;\n  --green-400: #7dc242;\n  --green-300: #a8d77a;\n\n  /* surfaces */\n  --bg:        #f6f7f9;\n  --surface:   #ffffff;\n  --surface-2: #f1f3f6;\n\n  /* ink */\n  --ink:       #0f1a35;\n  --ink-soft:  #2a3450;\n  --ink-mute:  #6b7488;\n  --ink-faint: #97a0b3;\n\n  /* lines & shadows */\n  --line:        #e6e8ec;\n  --line-strong: #cfd3da;\n  --shadow-sm:   0 1px 2px rgba(15,26,53,.05);\n  --shadow-md:   0 6px 18px -8px rgba(15,26,53,.12);\n  --shadow-lg:   0 18px 40px -16px rgba(15,26,53,.18);\n\n  /* radius */\n  --r-sm:  8px;\n  --r-md:  12px;\n  --r-lg:  16px;\n  --r-xl:  22px;\n  --r-2xl: 28px;\n\n  /* status */\n  --good: #16a34a;\n  --bad:  #dc2626;\n  --warn: #f59e0b;\n\n  /* layout */\n  --header-h: 76px;\n  --max:     1240px;\n}\n\n* { box-sizing: border-box; }\nhtml, body { margin: 0; padding: 0; }\nbody {\n  font-family: 'Poppins', system-ui, -apple-system, Segoe UI, Roboto, Inter, sans-serif;\n  background: var(--bg);\n  color: var(--ink);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\na { color: inherit; text-decoration: none; }\nimg, svg { display: block; max-width: 100%; }\nbutton { font-family: inherit; cursor: pointer; }\n\n.container {\n  width: 100%; max-width: var(--max);\n  margin: 0 auto; padding: 0 28px;\n}\n\n/* ============ HEADER ============ */\n.header {\n  position: sticky; top: 0; z-index: 100;\n  background: #fff;\n  border-bottom: 1px solid var(--line);\n  height: var(--header-h);\n  display: flex; align-items: center;\n}\n.header-inner {\n  display: flex; align-items: center; gap: 24px;\n  width: 100%; max-width: var(--max);\n  margin: 0 auto; padding: 0 28px;\n}\n.logo {\n  display: flex; align-items: center; gap: 10px;\n  flex-shrink: 0;\n}\n.logo svg { width: 38px; height: 38px; }\n.logo-text { line-height: 1; }\n.logo-name {\n  font-weight: 700; font-size: 22px; color: var(--navy-800);\n  letter-spacing: -0.01em;\n}\n.logo-tag {\n  font-size: 9.5px; letter-spacing: 0.18em;\n  color: var(--ink-mute); text-transform: uppercase;\n  margin-top: 2px;\n}\n\n.nav { flex: 1; display: flex; justify-content: center; }\n.nav-list {\n  display: flex; gap: 22px;\n  list-style: none; padding: 0; margin: 0;\n}\n.nav-list a {\n  font-size: 14.5px; font-weight: 500;\n  color: var(--ink-soft); padding: 8px 2px;\n  position: relative;\n  transition: color .2s ease;\n}\n.nav-list a:hover { color: var(--green-500); }\n.nav-list a.active { color: var(--green-500); }\n.nav-list a.active::after {\n  content: \"\"; position: absolute;\n  left: 0; right: 0; bottom: -2px;\n  height: 2px; background: var(--green-500); border-radius: 2px;\n}\n.nav-list a.has-caret::after,\n.nav-list a.has-caret-static::after {\n  content: \" ▾\"; font-size: 10px; color: inherit;\n  position: static; background: none;\n}\n\n.btn-whatsapp {\n  display: inline-flex; align-items: center; gap: 8px;\n  background: var(--green-500); color: #fff;\n  padding: 10px 18px; border-radius: 999px;\n  font-weight: 600; font-size: 14px;\n  border: none;\n  box-shadow: 0 6px 14px -6px rgba(76, 175, 80, .55);\n  transition: transform .2s ease, box-shadow .25s ease;\n  flex-shrink: 0;\n}\n.btn-whatsapp:hover { transform: translateY(-1px); box-shadow: 0 10px 22px -8px rgba(76, 175, 80, .65); }\n.btn-whatsapp svg { width: 18px; height: 18px; }\n\n.hamburger {\n  display: none;\n  background: transparent; border: 0; padding: 8px;\n  color: var(--ink);\n}\n\n/* ============ HERO ============ */\n.hero {\n  background: linear-gradient(135deg, var(--navy-900) 0%, var(--navy-800) 55%, var(--navy-700) 100%);\n  color: #fff;\n  position: relative;\n  overflow: hidden;\n}\n.hero::before {\n  /* subtle dot grid */\n  content: \"\"; position: absolute; inset: 0;\n  background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);\n  background-size: 28px 28px;\n  opacity: .35;\n  pointer-events: none;\n}\n.hero-inner {\n  position: relative; z-index: 1;\n  max-width: var(--max); margin: 0 auto;\n  padding: 56px 28px 72px;\n  display: grid; grid-template-columns: 1fr 1fr;\n  gap: 48px; align-items: center;\n}\n.crumb {\n  font-size: 13px; color: rgba(255,255,255,0.65);\n  margin-bottom: 18px;\n}\n.crumb a { color: rgba(255,255,255,0.65); }\n.crumb a:hover { color: #fff; }\n.hero h1 {\n  font-size: clamp(36px, 4.4vw, 56px);\n  font-weight: 700; line-height: 1.08;\n  margin: 0 0 18px; letter-spacing: -0.015em;\n}\n.hero h1 .accent { color: var(--green-400); }\n.hero h1 .accent-strong { color: var(--green-500); }\n.hero .lede {\n  font-size: 17px; line-height: 1.55;\n  color: rgba(255,255,255,0.82);\n  max-width: 540px; margin: 0 0 24px;\n}\n.callout {\n  display: flex; align-items: flex-start; gap: 12px;\n  padding: 14px 18px;\n  border: 1px solid rgba(255,255,255,0.18);\n  border-radius: var(--r-md);\n  background: rgba(255,255,255,0.04);\n  max-width: 520px; margin-bottom: 28px;\n}\n.callout .dot {\n  width: 22px; height: 22px; border-radius: 50%;\n  background: var(--green-500); flex-shrink: 0;\n  display: flex; align-items: center; justify-content: center;\n  margin-top: 2px;\n}\n.callout .dot::before {\n  content: \"\"; width: 8px; height: 4px;\n  border-left: 2px solid #fff; border-bottom: 2px solid #fff;\n  transform: rotate(-45deg) translate(0, -2px);\n}\n.callout p { margin: 0; font-size: 14px; line-height: 1.5; }\n.callout p strong { color: var(--green-400); }\n\n.hero-features {\n  display: flex; flex-wrap: wrap; gap: 28px;\n  margin-bottom: 28px;\n}\n.hero-feature {\n  display: flex; align-items: center; gap: 10px;\n  font-size: 13.5px; color: rgba(255,255,255,0.85);\n}\n.hero-feature svg { width: 22px; height: 22px; color: var(--green-400); flex-shrink: 0; }\n\n.hero-cta { display: flex; gap: 12px; flex-wrap: wrap; }\n.btn {\n  display: inline-flex; align-items: center; gap: 8px;\n  padding: 13px 22px; border-radius: 999px;\n  font-weight: 600; font-size: 14.5px;\n  border: 1px solid transparent;\n  transition: transform .2s ease, box-shadow .25s ease, background .2s ease, border-color .2s ease;\n}\n.btn-primary {\n  background: var(--green-500); color: #fff;\n  box-shadow: 0 8px 18px -8px rgba(76, 175, 80, .55);\n}\n.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 26px -10px rgba(76, 175, 80, .7); }\n.btn-ghost {\n  background: transparent; color: #fff;\n  border-color: rgba(255,255,255,0.4);\n}\n.btn-ghost:hover { background: rgba(255,255,255,0.07); border-color: #fff; }\n.btn-light {\n  background: #fff; color: var(--navy-800);\n  box-shadow: var(--shadow-sm);\n}\n.btn-light:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }\n.btn-outline {\n  background: transparent; color: var(--ink);\n  border-color: var(--line-strong);\n}\n.btn-outline:hover { border-color: var(--green-500); color: var(--green-600); }\n.btn .ic { display: inline-flex; align-items: center; }\n.btn .ic svg { width: 18px; height: 18px; }\n\n.hero-art {\n  position: relative;\n  border-radius: var(--r-xl); overflow: hidden;\n  min-height: 380px;\n  background: rgba(255,255,255,0.04);\n  display: flex; align-items: center; justify-content: center;\n}\n.hero-art img, .hero-art video {\n  width: 100%; height: 100%; object-fit: cover;\n}\n\n.hero-side-card {\n  position: absolute; top: 20px; right: -8px;\n  width: 240px;\n  background: #fff;\n  color: var(--ink);\n  border-radius: var(--r-lg);\n  padding: 18px;\n  box-shadow: var(--shadow-lg);\n}\n.hero-side-card .badge {\n  display: inline-flex; align-items: center; gap: 6px;\n  font-weight: 600; font-size: 13px;\n  color: var(--bad); margin-bottom: 10px;\n}\n.hero-side-card .badge::before {\n  content: \"\"; width: 18px; height: 18px;\n  border: 2px solid var(--bad); border-radius: 50%;\n  background:\n    linear-gradient(45deg, transparent 46%, var(--bad) 46%, var(--bad) 54%, transparent 54%);\n  display: inline-block;\n}\n.hero-side-card h4 { margin: 0 0 6px; font-size: 15px; }\n.hero-side-card p { margin: 0 0 12px; font-size: 13px; color: var(--ink-mute); line-height: 1.5; }\n.hero-side-card .link { color: var(--green-600); font-weight: 600; font-size: 13.5px; }\n.hero-side-card .link:hover { text-decoration: underline; }\n\n/* ============ SECTIONS / WHITE BG ============ */\n.section {\n  background: var(--surface);\n  padding: 72px 0;\n}\n.section.tinted { background: var(--surface-2); }\n.section-h {\n  text-align: center;\n  margin-bottom: 48px;\n}\n.section-h h2 {\n  font-size: clamp(26px, 2.8vw, 34px);\n  font-weight: 700; color: var(--ink);\n  margin: 0 0 12px; letter-spacing: -0.01em;\n}\n.section-h .dash {\n  width: 56px; height: 3px;\n  background: var(--green-500);\n  margin: 0 auto;\n  border-radius: 2px;\n}\n.section-h p { margin: 14px auto 0; max-width: 600px; color: var(--ink-mute); }\n\n/* ============ FEATURE CARD GRIDS ============ */\n.cards {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));\n  gap: 18px;\n}\n.cards.cols-6 { grid-template-columns: repeat(6, 1fr); }\n.cards.cols-5 { grid-template-columns: repeat(5, 1fr); }\n.cards.cols-4 { grid-template-columns: repeat(4, 1fr); }\n.cards.cols-3 { grid-template-columns: repeat(3, 1fr); }\n\n.card {\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: var(--r-lg);\n  padding: 22px 20px;\n  display: flex; flex-direction: column; gap: 12px;\n  transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;\n}\n.card:hover {\n  transform: translateY(-4px);\n  box-shadow: var(--shadow-md);\n  border-color: #d8dde6;\n}\n.card-icon {\n  width: 48px; height: 48px;\n  border-radius: 12px;\n  display: flex; align-items: center; justify-content: center;\n  color: var(--card-c, var(--green-600));\n  background: color-mix(in oklab, var(--card-c, var(--green-600)) 12%, transparent);\n}\n.card-icon svg { width: 26px; height: 26px; stroke-width: 1.7; }\n.card h3 {\n  margin: 0; font-size: 16px; font-weight: 600; color: var(--ink);\n  letter-spacing: -0.005em;\n}\n.card p {\n  margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--ink-mute);\n}\n.card .verm {\n  font-weight: 600; font-size: 13.5px;\n  color: var(--card-c, var(--green-600));\n  display: inline-flex; align-items: center; gap: 6px;\n  margin-top: auto;\n}\n.card .verm:hover { text-decoration: underline; }\n\n/* circular icon (for proceso bar / hero features) */\n.circle-ico {\n  width: 70px; height: 70px;\n  border: 1px solid var(--line-strong);\n  background: #fff;\n  border-radius: 50%;\n  display: flex; align-items: center; justify-content: center;\n  color: var(--green-600);\n}\n.circle-ico svg { width: 30px; height: 30px; stroke-width: 1.5; }\n\n/* ============ PROCESS BAR ============ */\n.process {\n  display: grid;\n  grid-template-columns: repeat(var(--steps, 6), 1fr);\n  gap: 16px;\n  position: relative;\n}\n.process::before {\n  content: \"\"; position: absolute;\n  top: 35px; left: 8%; right: 8%; height: 1px;\n  border-top: 2px dashed var(--line-strong);\n  z-index: 0;\n}\n.step {\n  position: relative; z-index: 1;\n  display: flex; flex-direction: column; align-items: center;\n  text-align: center;\n  gap: 14px;\n}\n.step .circle-ico { background: var(--surface-2); }\n.step h4 {\n  font-size: 14.5px; font-weight: 600; color: var(--ink);\n  margin: 0;\n}\n.step p { font-size: 12.5px; color: var(--ink-mute); line-height: 1.5; margin: 0; }\n\n/* ============ INFO PANELS ROW ============ */\n.panels {\n  display: grid;\n  grid-template-columns: 1fr 1fr 1fr 1fr;\n  gap: 20px;\n}\n.panel {\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: var(--r-lg);\n  padding: 24px;\n}\n.panel.dark {\n  background: var(--navy-800);\n  color: #fff;\n  border-color: var(--navy-700);\n}\n.panel h3 {\n  margin: 0 0 14px; font-size: 17px; font-weight: 700; color: var(--ink);\n}\n.panel.dark h3 { color: #fff; }\n.panel ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }\n.panel li {\n  display: flex; align-items: flex-start; gap: 10px;\n  font-size: 13.5px; color: var(--ink-soft); line-height: 1.45;\n}\n.panel.dark li { color: rgba(255,255,255,0.85); }\n.panel li .ck {\n  flex-shrink: 0; width: 18px; height: 18px;\n  color: var(--green-600); margin-top: 1px;\n}\n.panel li .icb {\n  flex-shrink: 0; width: 22px; height: 22px;\n  color: var(--green-600);\n}\n\n/* ============ BOTTOM RIBBON (4-6 column features) ============ */\n.ribbon {\n  background: var(--surface-2);\n  padding: 36px 0;\n  border-top: 1px solid var(--line);\n}\n.ribbon-inner {\n  display: grid;\n  grid-template-columns: repeat(var(--cols, 4), 1fr);\n  gap: 28px;\n  max-width: var(--max); margin: 0 auto; padding: 0 28px;\n}\n.ribbon-item {\n  display: flex; align-items: flex-start; gap: 12px;\n}\n.ribbon-item svg <!-- Mercado Pago Integration -->
<script src="https://sdk.mercadopago.com/js/v2"></script>
<script>
(function() {
  'use strict';

  const CONFIG = {
    price: 50,
    currency: 'MXN',
    period: 'único',
    plan: 'acredita-bach',
    storageKey: 'yesems_access',
    supabaseUrl: 'https://zwqreojkgobvhdffbowi.supabase.co',
    whatsapp: 'https://api.whatsapp.com/send/?phone=5215648666596&text=Quiero%20acceder%20al%20curso%20Acredita-Bach%20de%20YES%20EMS',
  };

  // ─── HELPERS ──────────────────────────────────
  function getSupabaseAnon() {
    try {
      return (window.YESEMS_SUPABASE || {}).SUPABASE_ANON_KEY || '';
    } catch { return ''; }
  }

  function hasAccess() {
    try {
      const d = JSON.parse(localStorage.getItem(CONFIG.storageKey) || '{}');
      return d.granted === true && (!d.expires || Date.now() < d.expires);
    } catch { return false; }
  }

  function saveAccess(email) {
    localStorage.setItem(CONFIG.storageKey, JSON.stringify({
      granted: true,
      email: email || '',
      plan: CONFIG.plan,
      expires: Date.now() + 365 * 24 * 60 * 60 * 1000,
    }));
  }

  // ─── UNLOCK CONTENT ───────────────────────────
  function unlockContent() {
    document.querySelectorAll('.locked-wrap').forEach(function(w) {
      var pw = w.querySelector('.paywall');
      if (pw) pw.remove();
      var ll = w.querySelector('.locked-list');
      if (ll) ll.classList.remove('locked-list');
    });
    document.querySelectorAll('.topic.locked').forEach(function(t) {
      t.classList.remove('locked');
    });
    document.querySelectorAll('.sub-banner.locked').forEach(function(b) {
      b.classList.remove('locked');
      b.classList.add('active');
    });
    document.querySelectorAll('.sub-buy').forEach(function(btn) {
      btn.textContent = '✔ Acceso activo';
      btn.disabled = true;
      btn.style.opacity = '0.6';
    });
  }

  // ─── UPDATE PRICE DISPLAY ─────────────────────
  function updatePriceDisplay() {
    var amount = document.querySelector('.sub-amount');
    var period = document.querySelector('.sub-period');
    if (amount) amount.textContent = '50';
    if (period) period.innerHTML = 'MXN<br>' + 'único';
  }

  // ─── CHECK SUPABASE ACCESS ────────────────────
  async function checkSupabaseAccess(email) {
    if (!email) return false;
    var key = getSupabaseAnon();
    if (!key) return false;
    try {
      var r = await fetch(CONFIG.supabaseUrl + '/rest/v1/user_access?email=eq.' +
        encodeURIComponent(email) + '&access_granted=eq.true&select=email,expires_at',
        { headers: { apikey: key } }
      );
      if (!r.ok) return false;
      var data = await r.json();
      if (Array.isArray(data) && data.length > 0) {
        var expires = data[0].expires_at ? new Date(data[0].expires_at) : null;
        if (!expires || expires > new Date()) {
          saveAccess(email);
          unlockContent();
          return true;
        }
      }
    } catch {}
    return false;
  }

  // ─── MERCADO PAGO PREFERENCE ──────────────────
  async function createPreference(email) {
    var key = getSupabaseAnon();
    if (key) {
      try {
        var r = await fetch(CONFIG.supabaseUrl + '/functions/v1/createpreference', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            apikey: key,
            Authorization: 'Bearer ' + key,
          },
          body: JSON.stringify({ email: email || '', plan: CONFIG.plan }),
        });
        if (r.ok) {
          var d = await r.json();
          if (d.init_point) return d.init_point;
        }
      } catch (e) { console.warn('Edge Function error:', e); }
    }
    return null;
  }

  // ─── PAYMENT HANDLER ──────────────────────────
  function handlePaymentReturn() {
    var p = new URLSearchParams(window.location.search);
    if (p.get('payment') === 'success') {
      if (window.history.replaceState) {
        window.history.replaceState({}, '', window.location.pathname + window.location.hash);
      }
      saveAccess('');
      unlockContent();
      return true;
    }
    return false;
  }

  // ─── SETUP BUY BUTTONS ────────────────────────
  function setupBuyButtons() {
    document.querySelectorAll('.sub-buy').forEach(function(btn) {
      btn.addEventListener('click', async function(e) {
        e.preventDefault();
        var email = '';
        try {
          var u = window.YESEMS_AUTH && window.YESEMS_AUTH.getUser();
          if (u && u.email) email = u.email;
        } catch {}
        btn.textContent = 'Conectando con Mercado Pago…';
        btn.disabled = true;
        var url = await createPreference(email);
        if (url) {
          window.location.href = url;
        } else {
          btn.textContent = 'Comenzar ahora';
          btn.disabled = false;
          alert('Pago no disponible por ahora. Contáctanos por WhatsApp.');
          window.open(CONFIG.whatsapp, '_blank');
        }
      });
    });
  }

  // ─── INIT ─────────────────────────────────────
  function init() {
    updatePriceDisplay();
    if (handlePaymentReturn()) return;
    if (hasAccess()) { unlockContent(); return; }
    // Check if user is logged in
    try {
      var user = window.YESEMS_AUTH && window.YESEMS_AUTH.getUser();
      if (user && user.email) checkSupabaseAccess(user.email);
    } catch {}
    setupBuyButtons();
  }

  if (document.readyState === 'complete') setTimeout(init, 600);
  else window.addEventListener('load', function() { setTimeout(init, 600); });
})();
</script>
