            <label>Contraseña</label>
            <input type="password" id="authPass" autocomplete="current-password" placeholder="••••••••" minlength="6" required>
          </div>
          <p class="auth-error" id="authError" hidden></p>
          <p class="auth-ok" id="authOk" hidden></p>
          <button class="btn btn-primary auth-submit" id="authSubmit" type="submit">Entrar</button>
          <p class="auth-forgot" style="text-align:center;margin-top:8px">
            <button type="button" id="authRecover" class="auth-link">Olvidaste tu contrasena</button>
          </p>
        </form>

        <p class="auth-switch">
          <span id="authSwitchTxt">¿No tienes cuenta?</span>
          <button type="button" id="authSwitch" class="auth-link">Crea una aquí</button>
        </p>
        <p class="auth-demo-note" id="authDemoNote" hidden>Modo demostración: aún no se ha conectado Supabase.</p>
      </div>`;
    document.body.appendChild(wrap);
    modalEl = wrap;

    // wiring
    let mode = 'login'; // 'login' | 'signup'
    const $ = (s) => wrap.querySelector(s);
    const nameField = $('.auth-name-field');
    const err = $('#authError'), ok = $('#authOk');

    function setMode(m) {
      mode = m;
      $('#authTitle').textContent = m === 'login' ? 'Inicia sesión' : 'Crea tu cuenta';
      $('#authSub').textContent   = m === 'login' ? 'Accede a tu material de estudio' : 'Regístrate para comenzar a estudiar';
      $('#authSubmit').textContent = m === 'login' ? 'Entrar' : 'Crear cuenta';
      $('#authSwitchTxt').textContent = m === 'login' ? '¿No tienes cuenta?' : '¿Ya tienes cuenta?';
      $('#authSwitch').textContent = m === 'login' ? 'Crea una aquí' : 'Inicia sesión';
      nameField.hidden = m === 'login';
      $('#authPass').setAttribute('autocomplete', m === 'login' ? 'current-password' : 'new-password');
      err.hidden = true; ok.hidden = true;
    }
    $('#authSwitch').addEventListener('click', () => setMode(mode === 'login' ? 'signup' : 'login'));
    wrap.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', closeModal));
    wrap.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

    $('#authGoogle').addEventListener('click', async () => {
      err.hidden = true;
      try { await signInGoogle(); }
      catch (e) { err.textContent = friendly(e); err.hidden = false; }
    });

    $('#authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      err.hidden = true; ok.hidden = true;
      const email = $('#authEmail').value.trim();
      const pass = $('#authPass').value;
      const name = $('#authName').value.trim();
      const submit = $('#authSubmit');
      submit.disabled = true; submit.textContent = 'Un momento…';
      try {
        if (mode === 'signup') {
          const r = await signUp(email, pass, name);
          if (r.needsConfirm) {
            ok.textContent = 'Te enviamos un correo para confirmar tu cuenta. Revísalo y luego inicia sesión.';
            ok.hidden = false;
            setMode('login');
          } else {
            closeModal(); // demo signup o proyecto sin confirmación
          }
        } else {
          await signIn(email, pass);
          closeModal(); // éxito de login (en modo real, onAuthStateChange ya cierra; cerrar de nuevo es inofensivo)
        }
      } catch (ex) {
        err.textContent = friendly(ex); err.hidden = false;
      } finally {
        submit.disabled = false;
        submit.textContent = mode === 'login' ? 'Entrar' : 'Crear cuenta';
      }
    });
    document.getElementById('authRecover').addEventListener('click', async () => {
      err.hidden = true; ok.hidden = true;
      const email = document.getElementById('authEmail').value.trim();
      if (!email) {
        err.textContent = 'Escribe tu correo primero.';
        err.hidden = false;
        return;
      }
      try {
        await recoverPassword(email);
        ok.textContent = 'Te enviamos un enlace para restablecer tu contrasena. Revisa tu correo.';
        ok.hidden = false;
      } catch (ex) {
        err.textContent = friendly(ex);
        err.hidden = false;
      }
    });

    wrap._setMode = setMode;
    $('#authDemoNote').hidden = REAL;
    return wrap;
  }

  function friendly(e) {
    const m = (e && e.message) || '';
    if (/invalid login/i.test(m)) return 'Correo o contraseña incorrectos.';
    if (/already registered|already exists/i.test(m)) return 'Ese correo ya tiene una cuenta. Inicia sesión.';
    if (/password should be at least/i.test(m)) return 'La contraseña debe tener al menos 6 caracteres.';
    if (/email/i.test(m) && /valid/i.test(m)) return 'Escribe un correo válido.';
    return m || 'Ocurrió un error. Inténtalo de nuevo.';
  }

  function openModal(mode) {
    const m = buildModal();
    m.removeAttribute('hidden');
    if (m._setMode) m._setMode(mode || 'login');
    document.body.style.overflow = 'hidden';
    const f = m.querySelector('#authEmail'); if (f) setTimeout(() => f.focus(), 50);
  }
  function closeModal() {
    if (!modalEl) return;
    modalEl.setAttribute('hidden', '');
    document.body.style.overflow = '';
  }

  // ======================================================
  //  HEADER: botón de cuenta
  // ======================================================
  function renderHeaderAuth(user) {
    const slot = document.getElementById('ys-auth');
    if (!slot) return;
    if (user) {
      const initial = (user.name || user.email || '?').trim().charAt(0).toUpperCase();
      slot.innerHTML = `
        <div class="acct">
          <button class="acct-btn" id="acctBtn" aria-haspopup="true">
            <span class="acct-avatar">${initial}</span>
            <span class="acct-name">${user.name}</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="acct-menu" id="acctMenu" hidden>
            <div class="acct-menu-head">
              <strong>${user.name}</strong>
              <span>${user.email}</span>
            </div>
            <a href="acredita-bach.html#temas" class="acct-menu-item">Mi material de estudio</a>
            <button class="acct-menu-item danger" id="acctLogout" type="button">Cerrar sesión</button>
          </div>
        </div>`;
      const btn = slot.querySelector('#acctBtn');
      const menu = slot.querySelector('#acctMenu');
      btn.addEventListener('click', (e) => { e.stopPropagation(); menu.hidden = !menu.hidden; });
      slot.querySelector('#acctLogout').addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        menu.hidden = true;
        logout();
      });
    } else {
      slot.innerHTML = `<button class="acct-login" id="acctLogin" type="button">Iniciar sesión</button>`;
      slot.querySelector('#acctLogin').addEventListener('click', () => openModal('login'));
    }
  }

  // re-render header auth whenever header (re)mounts or user changes
  onChange((u) => renderHeaderAuth(u));

  // Cierre del menú de cuenta al hacer clic fuera o con Escape.
  // Se registra UNA sola vez (evita la fuga de listeners por repintado).
  document.addEventListener('click', () => {
    const menu = document.getElementById('acctMenu');
    if (menu && !menu.hidden) menu.hidden = true;
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      const menu = document.getElementById('acctMenu');
      if (menu && !menu.hidden) menu.hidden = true;
    }
  });
  // header is injected by partials.js after DOMContentLoaded; observe for the slot
  function tryRender() { renderHeaderAuth(currentUser); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', tryRender);
  else tryRender();
  // also retry shortly after, in case partials.js mounts later
  setTimeout(tryRender, 0);
  setTimeout(tryRender, 300);

  // GARANTÍA: espera a que aparezca el slot #ys-auth (lo inyecta partials.js
  // de forma asíncrona) y entonces pinta el estado de sesión UNA vez.
  // IMPORTANTE: el observer se DESCONECTA en cuanto encuentra el slot. Si no,
  // como renderHeaderAuth modifica el DOM (slot.innerHTML), cada repintado
  // dispararía el observer otra vez → bucle infinito que congela la página.
  (function watchAuthSlot() {
    if (document.getElementById('ys-auth')) { tryRender(); return; }
    const obs = new MutationObserver(() => {
      if (document.getElementById('ys-auth')) {
        obs.disconnect();   // <-- corta el ciclo antes de tocar el DOM
        tryRender();
      }
    });
    const start = () => {
      // por si el slot apareció entre el chequeo inicial y aquí
      if (document.getElementById('ys-auth')) { tryRender(); return; }
      obs.observe(document.body, { childList: true, subtree: true });
    };
    if (document.body) start();
    else document.addEventListener('DOMContentLoaded', start);
  })();

  // ---------- update user metadata in Supabase ----------
  async function updateMeta(data) {
    if (!REAL || !supa) return;
    try {
      const { error } = await supa.auth.updateUser({ data });
      if (error) console.warn('[YESEMS_AUTH] updateMeta:', error.message);
    } catch (e) {
      console.warn('[YESEMS_AUTH] updateMeta error:', e.message);
    }
  }

  // ---------- get raw session (includes user_metadata) ----------
  async function getSession() {
    if (!REAL || !supa) return null;
    try {
      const { data } = await supa.auth.getSession();
      return (data && data.session) ? data.session : null;
    } catch (e) { return null; }
  }

  
  function showRecoveryForm() {
    if (!modalEl || modalEl.hidden) { buildModal(); }
    modalEl.removeAttribute('hidden');
    document.body.style.overflow = 'hidden';
    const err = modalEl.querySelector('#authError');
    const ok = modalEl.querySelector('#authOk');
    err.hidden = true; ok.hidden = true;
    modalEl.querySelector('.auth-head').innerHTML = '<h2 class="auth-title">Nueva contrasena</h2><p class="auth-sub">Escribe tu nueva contrasena de acceso</p>';
    modalEl.querySelector('.auth-google').hidden = true;
    modalEl.querySelector('.auth-or').hidden = true;
    modalEl.querySelector('.auth-switch').hidden = true;
    modalEl.querySelector('.auth-name-field').hidden = true;
    modalEl.querySelector('#authSubmit').textContent = 'Actualizar contrasena';
    const form = modalEl.querySelector('#authForm');
    const emailField = modalEl.querySelector('.auth-field');
    emailField.innerHTML = '<label>Nueva contrasena</label><input type="password" id="authNewPass1" autocomplete="new-password" placeholder="Minimo 6 caracteres" minlength="6" required>';
    const newField = document.createElement('div');
    newField.className = 'auth-field';
    newField.innerHTML = '<label>Confirmar contrasena</label><input type="password" id="authNewPass2" autocomplete="new-password" placeholder="Repite la contrasena" minlength="6" required>';
    form.insertBefore(newField, emailField.nextSibling);
    form.onsubmit = async (e) => {
      e.preventDefault();
      err.hidden = true; ok.hidden = true;
      const p1 = document.getElementById('authNewPass1').value;
      const p2 = document.getElementById('authNewPass2').value;
      if (p1 !== p2) { err.textContent = 'Las contrasenas no coinciden.'; err.hidden = false; return; }
      if (p1.length < 6) { err.textContent = 'Minimo 6 caracteres.'; err.hidden = false; return; }
      try {
        const { error } = await supa.auth.updateUser({ password: p1 });
        if (error) throw error;
        ok.textContent = 'Contrasena actualizada. Ya puedes usar el panel.';
        ok.hidden = false;
        setTimeout(closeModal, 1500);
      } catch (ex) {
        err.textContent = friendly(ex);
        err.hidden = false;
      }
    };
  }

  // ---------- export ----------
  window.YESEMS_AUTH = { getUser, onChange, openModal, logout, isReal: () => REAL, updateMeta, getSession };

  boot();
})();
</script>
<script>// ============================================================
//  CONTENT STORE  ·  YES EMS
//  ------------------------------------------------------------
//  Puente entre la página y Supabase para el CONTENIDO del curso
//  (áreas, temas, exámenes, PDFs y suscripción).
//
//  - load()        carga el contenido desde Supabase (o usa los
//                  valores por defecto si aún no hay nada guardado).
//  - save(doc)     guarda TODO el contenido (solo administradores).
//  - uploadPDF()   sube un archivo PDF al almacenamiento de Supabase.
//  - ready         promesa que se resuelve cuando el contenido cargó.
//  - data          el documento de contenido ya combinado y listo.
//  - defaults      copia de los valores de fábrica.
//
//  Debe cargarse DESPUÉS de: data/modules.js, data/topic-quizzes.js,
//  data/site-defaults.js y supabase-config.js.
// ============================================================
(function () {
  const cfg  = window.YESEMS_SUPABASE || {};
  const REAL = !!(cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY);
  const CONTENT_ID = 'acredita-bach';
  const BUCKET     = 'pdfs';

  const clone = (o) => (o == null ? o : JSON.parse(JSON.stringify(o)));

  // Cliente Supabase: reusa el de auth.js si existe; si no, crea uno.
  let supa = window.YESEMS_SUPA_CLIENT || null;
  if (!supa && REAL && window.supabase) {
    supa = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'implicit',
        lock: (_name, _acquireTimeout, fn) => fn() }
    });
    window.YESEMS_SUPA_CLIENT = supa;
  }

  // ---- Captura de los valores de fábrica (ANTES de aplicar remoto) ----
  const DEFAULTS = {
    areasOrder:   clone(window.YESEMS_AREAS_DEFAULT || null),
    modules:      clone(window.modulesData || {}),
    quizzes:      clone(window.topicQuizzes || {}),
    pdfs:         clone(window.topicPDFs || {}),
    subscription: clone(window.YESEMS_SUB_DEFAULT || null)
  };

  function mergeDefaults(remote) {
    const r = remote || {};
    return {
      areasOrder:   r.areasOrder   || clone(DEFAULTS.areasOrder),
      modules:      r.modules      || clone(DEFAULTS.modules),
      quizzes:      r.quizzes      || clone(DEFAULTS.quizzes),
      pdfs:         r.pdfs         || clone(DEFAULTS.pdfs),
      subscription: r.subscription || clone(DEFAULTS.subscription)
    };
  }

  // Aplica un documento a las variables globales que usa la página.
  function apply(doc) {
    if (!doc) return;
    if (doc.modules) window.modulesData = doc.modules;
    if (doc.quizzes) window.topicQuizzes = doc.quizzes;
    if (doc.pdfs)    window.topicPDFs = doc.pdfs;
  }

  async function fetchDoc() {
    if (!supa) return null;
    try {
      const { data, error } = await supa
        .from('site_content').select('data').eq('id', CONTENT_ID).maybeSingle();
      if (error) { console.warn('[content] lectura:', error.message); return null; }
      return data ? data.data : null;
    } catch (e) {
      console.warn('[content] lectura falló:', e.message);
      return null;
    }
  }

  async function load() {
    const remote = await fetchDoc();
    const hasRemote = remote && Object.keys(remote).length > 0;
    const doc = mergeDefaults(remote);
    apply(doc);
    api.data   = doc;
    api.source = hasRemote ? 'supabase' : 'defaults';
    return doc;
  }

  async function save(doc, email) {
    if (!supa) throw new Error('Supabase no está configurado.');
    const payload = {
      id: CONTENT_ID,
      data: doc,
      updated_at: new Date().toISOString(),
      updated_by: email || null
    };
    const { error } = await supa.from('site_content').upsert(payload);
    if (error) throw error;
    api.data = clone(doc);
    api.source = 'supabase';
  }

  async function uploadPDF(file, email) {
    if (!supa) throw new Error('Supabase no está configurado.');
    const safe = (file.name || 'documento.pdf').replace(/[^a-zA-Z0-9._-]/g, '_');
    const path = Date.now() + '_' + safe;
    const { error } = await supa.storage.from(BUCKET)
      .upload(path, file, { upsert: true, contentType: file.type || 'application/pdf' });
    if (error) throw error;
    const { data } = supa.storage.from(BUCKET).getPublicUrl(path);
    return data.publicUrl;
  }

  const api = {
    load, save, uploadPDF,
    data: null,
    source: null,
    defaults: DEFAULTS,
    isReal: () => REAL,
    hasClient: () => !!supa,
    client: () => supa,
    CONTENT_ID, BUCKET
  };
  api.ready = load();

  window.YESEMS_CONTENT = api;
})();
</script>
<script>// ============================================================
//  PANEL DE ADMINISTRADOR · YES EMS
//  Edita áreas, temas, PDFs, exámenes y suscripción, y los guarda
//  en Supabase para que los alumnos los vean en la página principal.
// ============================================================
(function () {
  'use strict';

  // Correos autorizados como administradores (compara en minúsculas).
  // Debe coincidir con las políticas SQL de SETUP-SUPABASE.md
  const ADMIN_EMAILS = ['raulyeyo12@gmail.com', 'raulgarciarivera08@gmail.com', 'raulgarciarivera8@gmail.com'];
  const ADMIN_VERSION = 'v7'; // etiqueta visible para confirmar qué versión está en línea

  const $  = (s, r = document) => r.querySelector(s);
  const clone = (o) => (o == null ? o : JSON.parse(JSON.stringify(o)));
  const isAdmin = (u) => !!(u && u.email && ADMIN_EMAILS.includes(u.email.toLowerCase()));

  // ---------- escape ----------
  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const escAttr = (s) => esc(s).replace(/"/g, '&quot;');

  // ---------- path helpers ----------
  function getPath(o, p) { return p.split('.').reduce((a, k) => (a == null ? undefined : a[k]), o); }
  function setPath(o, p, v) {
    const ks = p.split('.'); let a = o;
    for (let i = 0; i < ks.length - 1; i++) { if (a[ks[i]] == null) a[ks[i]] = {}; a = a[ks[i]]; }
    a[ks[ks.length - 1]] = v;
  }

  // ---------- estado ----------
  const state = { doc: null, tab: 'content', areaKey: null, expanded: new Set(), dirty: false, ready: false };
  let currentUser = null;

  // ---------- DOM refs ----------
  const gate     = $('#adminGate');
  const gateBody = $('#gateBody');
  const bar      = $('#adminBar');
  const shell    = $('#adminShell');
  const main     = $('#adminMain');
  const sideAreaList = $('#sideAreaList');
  const sideAreas    = $('#sideAreas');

  // =========================================================
  //  GATE (acceso)
  // =========================================================
  function showGate(kind, user) {
    gate.hidden = false; bar.hidden = true; shell.hidden = true;
    const stamp = `<p style="margin-top:14px;font-size:11px;color:#9aa3b2">Versión ${ADMIN_VERSION}</p>`;
    if (kind === 'loading') {
      gateBody.innerHTML = `<div class="gate-spinner"></div><h1>Cargando…</h1><p>Verificando tu acceso.</p>${stamp}`;
      // En caso extremo, no dejes esta pantalla más de 3s.
      clearTimeout(showGate._lt);
      showGate._lt = setTimeout(() => { if (!booted && gate && !gate.hidden) showGate('login'); }, 3000);
    } else if (kind === 'login') {
      gateBody.innerHTML = `
        <h1>Acceso de administrador</h1>
        <p>Inicia sesión con un correo autorizado para administrar el contenido del curso.</p>
        <div class="gate-actions">
          <button class="gate-btn" id="gateLogin" type="button">Iniciar sesión</button>
          <a class="gate-btn alt" href="index.html">Volver al sitio</a>
        </div>${stamp}`;
      $('#gateLogin').addEventListener('click', () => window.YESEMS_AUTH.openModal('login'));
    } else if (kind === 'denied') {
      gateBody.innerHTML = `
        <div class="gate-icon-bad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg></div>
        <h1>Sin permiso</h1>
        <p>La cuenta <span class="gate-mail">${esc(user && user.email)}</span> no está autorizada como administrador.</p>
        <div class="gate-actions">
          <button class="gate-btn alt" id="gateLogout" type="button">Cambiar de cuenta</button>
          <a class="gate-btn alt" href="index.html">Volver al sitio</a>
        </div>`;
      $('#gateLogout').addEventListener('click', () => window.YESEMS_AUTH.logout());
    }
  }
  function hideGate() { gate.hidden = true; bar.hidden = false; shell.hidden = false; }

  // =========================================================
  //  INIT del panel (una sola vez, tras autorizar)
  // =========================================================
  let booted = false;
  async function bootPanel(user) {
    hideGate();
    $('#adminEmail').textContent = user.email;
    $('#adminAvatar').textContent = (user.name || user.email || 'A').trim().charAt(0).toUpperCase();
    if (booted) return;
    booted = true;

    await window.YESEMS_CONTENT.ready;
    state.doc = clone(window.YESEMS_CONTENT.data);
    if (!state.doc.areasOrder) state.doc.areasOrder = clone(window.YESEMS_CONTENT.defaults.areasOrder) || [];
    if (!state.doc.modules)    state.doc.modules = {};
    if (!state.doc.quizzes)    state.doc.quizzes = {};
    if (!state.doc.pdfs)       state.doc.pdfs = {};
    if (!state.doc.subscription) state.doc.subscription = clone(window.YESEMS_CONTENT.defaults.subscription) || {};
    state.areaKey = state.doc.areasOrder[0] ? state.doc.areasOrder[0].key : null;
    state.ready = true;

    updateSourcePill();
    bindChrome();
    renderSideAreas();
    renderMain();
  }

  function updateSourcePill() {
    const pill = $('#adminSource');
    if (!window.YESEMS_CONTENT.isReal()) {
      pill.textContent = 'Supabase no configurado'; pill.className = 'admin-source local'; return;
    }
    if (window.YESEMS_CONTENT.source === 'supabase') {
      pill.textContent = '● Publicado en línea'; pill.className = 'admin-source live';
    } else {
      pill.textContent = 'Contenido de fábrica'; pill.className = 'admin-source local';
    }
  }

  // =========================================================
  //  CHROME (barra, tabs)
  // =========================================================
  function bindChrome() {
    $('#btnSave').addEventListener('click', save);
    $('#btnLogout').addEventListener('click', () => {
      if (state.dirty && !confirm('Tienes cambios sin guardar. ¿Salir de todos modos?')) return;
      window.YESEMS_AUTH.logout();
    });
    $('#btnAddArea').addEventListener('click', addArea);

    $('#sideTabs').addEventListener('click', (e) => {
      const t = e.target.closest('.side-tab'); if (!t) return;
      state.tab = t.dataset.tab;
      $$all('.side-tab').forEach((b) => b.classList.toggle('active', b === t));
      sideAreas.style.display = state.tab === 'content' ? '' : 'none';
      renderMain();
    });

    // delegación de eventos del editor
    main.addEventListener('input', onInput);
    main.addEventListener('change', onChange);
    main.addEventListener('click', onClick);

    window.addEventListener('beforeunload', (e) => {
      if (state.dirty) { e.preventDefault(); e.returnValue = ''; }
    });
  }
  const $$all = (s, r = document) => Array.from(r.querySelectorAll(s));

  function markDirty(v) {
    state.dirty = v;
    $('#adminDirty').hidden = !v;
  }

  // =========================================================
  //  GUARDAR
  // =========================================================
  async function save() {
    const btn = $('#btnSave');
    if (!window.YESEMS_CONTENT.isReal()) {
      toast('Supabase no está configurado. Revisa SETUP-SUPABASE.md', 'err'); return;
    }
    btn.disabled = true; btn.textContent = 'Guardando…';
    try {
      await window.YESEMS_CONTENT.save(state.doc, currentUser.email);
      markDirty(false);
      updateSourcePill();
      toast('Cambios guardados y publicados ✓', 'ok');
    } catch (err) {
      console.error(err);
      let msg = err.message || 'No se pudo guardar.';
      if (/relation .* does not exist|site_content/i.test(msg) || /Could not find the table/i.test(msg)) {
        msg = 'Falta crear la tabla en Supabase. Abre SETUP-SUPABASE.md y ejecuta el Paso 1.';
      } else if (/row-level security|violates|policy|permission/i.test(msg)) {
        msg = 'Tu cuenta no tiene permiso de escritura. Revisa las políticas (Paso 1) y que tu correo esté autorizado.';
      }
      toast(msg, 'err');
    } finally {
      btn.disabled = false; btn.textContent = 'Guardar cambios';
    }
  }

  // =========================================================
  //  SIDEBAR de áreas
  // =========================================================
  function renderSideAreas() {
    sideAreaList.innerHTML = state.doc.areasOrder.map((a) => {
      const data = state.doc.modules[a.key] || { subsections: [] };
      const total = (data.subsections || []).reduce((s, x) => s + (x.topics ? x.topics.length : 0), 0);
      return `
        <div class="side-area ${a.key === state.areaKey ? 'active' : ''}" data-area="${escAttr(a.key)}">
          <span class="dot" style="background:${escAttr(a.color || '#888')}"></span>
          <span class="sa-label">${esc(a.label)}</span>
          <span class="sa-num">${total}</span>
        </div>`;
    }).join('');
    sideAreaList.querySelectorAll('.side-area').forEach((el) => {
      el.addEventListener('click', () => {
        state.areaKey = el.dataset.area;
        state.tab = 'content';
        $$all('.side-tab').forEach((b) => b.classList.toggle('active', b.dataset.tab === 'content'));
        sideAreas.style.display = '';
        renderSideAreas();
        renderMain();
      });
    });
  }

  // =========================================================
  //  RENDER principal
  // =========================================================
  function renderMain() {
    const y = window.scrollY;
    if (state.tab === 'content') renderAreaEditor();
    else if (state.tab === 'subscription') renderSubEditor();
    else renderStatus();
    window.scrollTo(0, y);
  }
  function rerender() { renderSideAreas(); renderMain(); }

  function computeMaxN() {
    let max = 0;
    Object.values(state.doc.modules).forEach((m) => (m.subsections || []).forEach((s) =>
      (s.topics || []).forEach((t) => { if (typeof t.n === 'number' && t.n > max) max = t.n; })));
    Object.keys(state.doc.quizzes).forEach((k) => { const n = parseInt(k, 10); if (n > max) max = n; });
    Object.keys(state.doc.pdfs).forEach((k) => { const n = parseInt(k, 10); if (n > max) max = n; });
    return max;
  }

          ${val
            ? `Actual: <a href="${escAttr(val)}" target="_blank" rel="noopener">${esc(decodeURIComponent(file))}</a>`
            : `<span class="none">Sin PDF asignado</span>`}

        <div class="pdf-tools">
          <label class="file-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M12 3v13M7 8l5-5 5 5"/></svg>

          <button class="icon-btn danger" data-act="del-opt" data-n="${n}" data-qi="${qi}" data-oi="${oi}" title="Quitar opción">✕</button>

  // =========================================================
  //  Manejadores de eventos
  // =========================================================
  function onInput(e) {
    const el = e.target;
    if (el.dataset.path !== undefined) {
      setPath(state.doc, el.dataset.path, el.value);
      markDirty(true);
      // sincronizaciones en vivo
      if (el.dataset.path.endsWith('.title')) {
        const topic = el.closest('.topic');
        if (topic) { const tt = topic.querySelector('.tt'); if (tt) tt.textContent = el.value || 'Sin título'; }
      }
      return;
    }
    if (el.dataset.bind === 'area-name') {
      const key = el.dataset.key;
      const i = state.doc.areasOrder.findIndex((a) => a.key === key);
      if (i >= 0) state.doc.areasOrder[i].label = el.value;
      if (state.doc.modules[key]) state.doc.modules[key].title = el.value;
      const at = $('#areaTitle'); if (at) at.textContent = el.value;
      const sa = sideAreaList.querySelector(`.side-area[data-area="${cssEsc(key)}"] .sa-label`);
      if (sa) sa.textContent = el.value;
      markDirty(true);
    }
  }
  function cssEsc(s){ return String(s).replace(/"/g,'\\"'); }

  function onChange(e) {
    const el = e.target;
    if (el.matches('input[type=file][data-pdf]')) { handlePdfFile(el); return; }
    if (el.dataset.correct !== undefined && el.checked) {
      setPath(state.doc, el.dataset.correct, el.value);
      markDirty(true);
      renderMain();
    }
  }

  async function handlePdfFile(el) {
    const path = el.dataset.pdf;
    const file = el.files && el.files[0];
    if (!file) return;
    if (file.type && file.type !== 'application/pdf') { toast('El archivo debe ser un PDF.', 'err'); el.value = ''; return; }
    if (!window.YESEMS_CONTENT.isReal()) { toast('Configura Supabase para subir archivos (SETUP-SUPABASE.md).', 'err'); el.value = ''; return; }
    toast('Subiendo PDF…', '');
    try {
      const url = await window.YESEMS_CONTENT.uploadPDF(file, currentUser.email);
      setPath(state.doc, path, url);
      markDirty(true);
      toast('PDF subido ✓ — recuerda Guardar cambios', 'ok');
      renderMain();
    } catch (err) {
      console.error(err);
      let msg = err.message || 'No se pudo subir.';
      if (/Bucket not found/i.test(msg)) msg = 'Falta crear el almacén “pdfs” en Supabase (SETUP, Paso 2).';
      else if (/row-level security|policy|permission|Unauthorized/i.test(msg)) msg = 'Sin permiso para subir. Revisa las políticas del Paso 2 y tu correo de admin.';
      toast(msg, 'err');
      el.value = '';
    }
  }

  function onClick(e) {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.dataset.act;
    const key = state.areaKey;
    const d = btn.dataset;

    switch (act) {
      case 'toggle-topic': {
        const n = +d.n;
        if (state.expanded.has(n)) state.expanded.delete(n); else state.expanded.add(n);
        const topic = btn.closest('.topic'); if (topic) topic.classList.toggle('open');
        return; // sin re-render
      }
      case 'add-sub':
        state.doc.modules[key].subsections.push({ title: 'Nueva subsección', topics: [] });
        break;
      case 'del-sub':
        if (!confirm('¿Eliminar esta subsección y todos sus temas?')) return;
        removeSubsection(key, +d.si);
        break;
      case 'add-topic': {
        const n = computeMaxN() + 1;
        state.doc.modules[key].subsections[+d.si].topics.push(
          { n, title: 'Nuevo tema', def: '', concepts: [], formula: '', example: '' });
        state.expanded.add(n);
        break;
      }
      case 'del-topic':
        if (!confirm('¿Eliminar este tema (incluye su PDF y examen)?')) return;
        removeTopic(key, +d.si, +d.ti, +d.n);
        break;
      case 'add-concept':
        ensureArr(d.p, 'concepts').push('');
        break;
      case 'del-concept':
        getPath(state.doc, d.p).concepts.splice(+d.i, 1);
        break;
      case 'add-q':
        ensureQuiz(+d.n).push({ q: '', options: [['A', ''], ['B', ''], ['C', '']], correct: 'A', just: '' });
        break;
      case 'del-q':
        if (!confirm('¿Eliminar esta pregunta?')) return;
        state.doc.quizzes[+d.n].splice(+d.qi, 1);
        if (!state.doc.quizzes[+d.n].length) delete state.doc.quizzes[+d.n];
        break;
      case 'add-opt': {
        const q = state.doc.quizzes[+d.n][+d.qi];
        q.options.push([String.fromCharCode(65 + q.options.length), '']);
        break;
      }
      case 'del-opt':
        removeOption(+d.n, +d.qi, +d.oi);
        break;
      case 'add-feature':
        state.doc.subscription.features.push('');
        break;
      case 'del-feature':
        state.doc.subscription.features.splice(+d.i, 1);
        break;
      case 'toggle-mp-token':
        const inp = btn.parentElement.querySelector('.inp');
        if (inp) inp.type = inp.type === 'password' ? 'text' : 'password';
        btn.textContent = inp.type === 'password' ? '👁' : '👁‍🗨';
        return;
      case 'del-area':
        if (!confirm('¿Eliminar toda esta área con sus temas, PDFs y exámenes? No se puede deshacer.')) return;
        removeArea(key);
        break;
      default: return;
    }
    markDirty(true);
    if (state.tab === 'subscription') renderMain();
    else rerender();
  }

  function ensureArr(p, field) {
    const o = getPath(state.doc, p);
    if (!o[field]) o[field] = [];
    return o[field];
  }
  function ensureQuiz(n) {
    if (!state.doc.quizzes[n]) state.doc.quizzes[n] = [];
    return state.doc.quizzes[n];
  }
  function removeOption(n, qi, oi) {
    const q = state.doc.quizzes[n][qi];
    const correctIdx = q.options.findIndex((o) => o[0] === q.correct);
    q.options.splice(oi, 1);
    q.options.forEach((o, i) => (o[0] = String.fromCharCode(65 + i)));
    let ci = correctIdx;
    if (oi === correctIdx) ci = 0;
    else if (oi < correctIdx) ci = correctIdx - 1;
    q.correct = q.options.length ? q.options[Math.max(0, Math.min(ci, q.options.length - 1))][0] : 'A';
  }
  function removeSubsection(key, si) {
    const sub = state.doc.modules[key].subsections[si];
    (sub.topics || []).forEach((t) => { delete state.doc.quizzes[t.n]; delete state.doc.pdfs[t.n]; });
    state.doc.modules[key].subsections.splice(si, 1);
  }
  function removeTopic(key, si, ti, n) {
    state.doc.modules[key].subsections[si].topics.splice(ti, 1);
    delete state.doc.quizzes[n];
    delete state.doc.pdfs[n];
    state.expanded.delete(n);
  }
  function removeArea(key) {
    const data = state.doc.modules[key];
    if (data) (data.subsections || []).forEach((s) => (s.topics || []).forEach((t) => {
      delete state.doc.quizzes[t.n]; delete state.doc.pdfs[t.n];
    }));
    delete state.doc.modules[key];
    state.doc.areasOrder = state.doc.areasOrder.filter((a) => a.key !== key);
    state.areaKey = state.doc.areasOrder[0] ? state.doc.areasOrder[0].key : null;
  }
  function addArea() {
    const key = 'area_' + Date.now().toString(36);
    const num = String(state.doc.areasOrder.length + 1).padStart(2, '0');
    const palette = ['#2563eb', '#16a34a', '#ea580c', '#7c3aed', '#db2777', '#0891b2', '#b45309'];
    const color = palette[state.doc.areasOrder.length % palette.length];
    state.doc.areasOrder.push({ key, label: 'Nueva área', num, color });
    state.doc.modules[key] = { title: 'Nueva área', reactivos: '', guide: '', intro: '', subsections: [] };
    state.areaKey = key;
    state.tab = 'content';
    $$all('.side-tab').forEach((b) => b.classList.toggle('active', b.dataset.tab === 'content'));
    sideAreas.style.display = '';
    markDirty(true);
    rerender();
  }

  // =========================================================
  //  TOAST
  // =========================================================
  let toastT;
  function toast(msg, kind) {
    const el = $('#adminToast');
    el.textContent = msg;
    el.className = 'admin-toast show' + (kind ? ' ' + kind : '');
    el.hidden = false;
    clearTimeout(toastT);
    if (kind !== '') toastT = setTimeout(() => { el.classList.remove('show'); }, 3200);
  }

  // =========================================================
  //  ARRANQUE
  // =========================================================
  showGate('login');
  if (!window.YESEMS_AUTH) {
    gateBody.innerHTML = `<h1>Error</h1><p>No se pudo cargar la autenticación. Revisa que auth.js esté incluido.</p>`;
  } else {
    window.YESEMS_AUTH.onChange((user) => {
      currentUser = user;
      if (!user) { if (!booted) showGate('login'); }
      else if (!isAdmin(user)) showGate('denied', user);
      else bootPanel(user);
    });
  }
})();
</script>
</body></html>
