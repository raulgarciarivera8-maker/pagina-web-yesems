<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YES EMS · Panel de Administrador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="yes-ems.css">
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="admin.css">
<script>window.YESEMS_PAGE = "admin";</script>
</head>
<body class="admin-body">

<!-- ===== Barra superior ===== -->
<header class="admin-bar" id="adminBar" hidden>
  <div class="admin-bar-left">
    <a class="admin-logo" href="index.html" title="Ir al sitio">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="adlogo" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#0a1e3f"/><stop offset="49.9%" stop-color="#0a1e3f"/>
          <stop offset="50%" stop-color="#5cb85c"/><stop offset="100%" stop-color="#5cb85c"/>
        </linearGradient></defs>
        <path d="M8 6 L28 6 L32 22 L36 6 L56 6 L40 36 L40 58 L24 58 L24 36 Z" fill="url(#adlogo)"/>
      </svg>
    </a>
    <div class="admin-bar-titles">
      <strong>Panel de administrador</strong>
      <span>Acredita-Bach · CENEVAL</span>
    </div>
    <span class="admin-source" id="adminSource"></span>
  </div>
  <div class="admin-bar-right">
    <span class="admin-dirty" id="adminDirty" hidden>● Cambios sin guardar</span>
    <a class="admin-btn ghost" href="acredita-bach.html" target="_blank" rel="noopener">Vista previa ↗</a>
    <button class="admin-btn primary" id="btnSave" type="button">Guardar cambios</button>
    <div class="admin-acct">
      <span class="admin-avatar" id="adminAvatar">A</span>
      <div class="admin-acct-info">
        <span id="adminEmail">—</span>
        <button class="admin-link" id="btnLogout" type="button">Cerrar sesión</button>
      </div>
    </div>
  </div>
</header>

<!-- ===== Pantalla de acceso / carga ===== -->
<div class="admin-gate" id="adminGate">
  <div class="gate-card" id="gateCard">
    <div class="gate-logo">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="gatelogo" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#0a1e3f"/><stop offset="49.9%" stop-color="#0a1e3f"/>
          <stop offset="50%" stop-color="#5cb85c"/><stop offset="100%" stop-color="#5cb85c"/>
        </linearGradient></defs>
        <path d="M8 6 L28 6 L32 22 L36 6 L56 6 L40 36 L40 58 L24 58 L24 36 Z" fill="url(#gatelogo)"/>
      </svg>
    </div>
    <div id="gateBody">
      <h1>Cargando…</h1>
      <p>Un momento, por favor.</p>
    </div>
  </div>
</div>

<!-- ===== Cuerpo del panel ===== -->
<div class="admin-shell" id="adminShell" hidden>
  <aside class="admin-side">
    <nav class="side-tabs" id="sideTabs">
      <button class="side-tab active" data-tab="content" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4h16v4l-6 4 6 4v4H4v-4l6-4-6-4z"/></svg>
        Áreas y temas
      </button>
      <button class="side-tab" data-tab="subscription" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
        Suscripción
      </button>
      <button class="side-tab" data-tab="status" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>
        Estado y ayuda
      </button>
    </nav>

    <div class="side-areas" id="sideAreas" data-tabgroup="content">
      <div class="side-areas-head">
        <span>Áreas del examen</span>
        <button class="side-add" id="btnAddArea" type="button" title="Agregar área">+</button>
      </div>
      <div class="side-area-list" id="sideAreaList"></div>
    </div>
  </aside>

  <main class="admin-main" id="adminMain"></main>
</div>

<!-- aviso flotante -->
<div class="admin-toast" id="adminToast" hidden></div>

<!-- librerías y lógica -->
<script src="data/modules.js"></script>
<script src="data/topic-quizzes.js"></script>
<script src="data/site-defaults.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="stripe-config.js"></script>
<script src="auth.js"></script>
<script src="content-store.js"></script>
<script src="admin.js"></script>
</body>
</html>
